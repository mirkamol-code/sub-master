events {
    worker_connections 1024;
}

http {
    # ── Upstream: Spring Boot app container on the Docker network ─────────────
    upstream spring_backend {
        server app:8080;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name subscriptionmaster.app www.subscriptionmaster.app subscription-master.app www.subscription-master.app;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (TLS termination) ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name subscriptionmaster.app www.subscriptionmaster.app subscription-master.app www.subscription-master.app;

        # SSL certificates (mount via docker-compose volume)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # ── /api/ → Spring Boot (/api/ context-path already on Spring) ────────
        #
        # IMPORTANT: controllers are mapped without /api (e.g. @RequestMapping("/auth")).
        # Spring Boot's context-path==/api absorbs the prefix.
        # Nginx passes the URI AS-IS (including /api/), which is exactly what Spring expects.
        #
        # Example flow:
        #   Browser → https://subscription-master.app/api/auth/login
        #   Nginx   → http://app:8080/api/auth/login   ← Spring context-path=/api matches ✓
        #
        location /api/ {
            proxy_pass         http://spring_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout  60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout  60s;
        }

        # ── Block direct access to everything else ────────────────────────────
        location / {
            return 404;
        }
    }
}
