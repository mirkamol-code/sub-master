services:
  app:
    container_name: subscription-master
    image: subscription-master:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # ── Database (points to the "db" service on the Docker network) ──
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-subscription_master_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mirkamol}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # ── App settings ──
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # ── SQL logging — keep off in production ──
      HIBERNATE_SHOW_SQL: "false"
      HIBERNATE_FORMAT_SQL: "false"
      # ── Notifications ──
      LOG_NOTIFICATIONS_ENABLED: ${LOG_NOTIFICATIONS_ENABLED:-true}
      GMAIL_NOTIFICATIONS_ENABLED: ${GMAIL_NOTIFICATIONS_ENABLED:-true}
      GMAIL_FROM: ${GMAIL_FROM:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    # No host port mapping — Nginx talks to this container on the internal network
    networks:
      - subscribe-master-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    container_name: subscription_master_db
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirkamol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-subscription_master_db}
    ports:
      - "5222:5432"   # exposed only for local DBA access — remove in production
    restart: unless-stopped
    volumes:
      - subscription-master-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirkamol} -d ${POSTGRES_DB:-subscription_master_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - subscribe-master-network

  nginx:
    container_name: subscription-master-nginx
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro    # mount your SSL certs here
    depends_on:
      app:
        condition: service_healthy
    networks:
      - subscribe-master-network

networks:
  subscribe-master-network:
    driver: bridge

volumes:
  subscription-master-db:
